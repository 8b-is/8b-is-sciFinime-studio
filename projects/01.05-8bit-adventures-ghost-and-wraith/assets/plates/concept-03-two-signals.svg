<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#12181e" stroke-width="0.75"/>
    </pattern>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#4fe3d0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4fe3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmber">
      <stop offset="0" stop-color="#e8b05c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#e8b05c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="seedGlow">
      <stop offset="0" stop-color="#4fe3d0" stop-opacity="0.35"/>
      <stop offset="0.3" stop-color="#4fe3d0" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4fe3d0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow">
      <stop offset="0" stop-color="#e8b05c" stop-opacity="0.38"/>
      <stop offset="0.3" stop-color="#e8b05c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#e8b05c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="decay" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="1070" y2="0">
      <stop offset="0" stop-color="#4fe3d0"/>
      <stop offset="1" stop-color="#b98cc0"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fe3d0"/>
      <stop offset="1" stop-color="#e8b05c"/>
    </linearGradient>
    <clipPath id="frameClip">
      <rect x="28" y="28" width="1544" height="844" rx="18"/>
    </clipPath>
  </defs>

  <!-- field -->
  <rect width="1600" height="900" fill="#0a0c0f"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="320" cy="200" r="640" fill="url(#glowCyan)"/>
  <circle cx="1300" cy="720" r="600" fill="url(#glowAmber)"/>

  <!-- label -->
  <text x="96" y="124" font-family="'SF Mono', ui-monospace, monospace" font-size="36" letter-spacing="4" fill="#cfd6dd">TWO SIGNALS</text>
  <line x1="96" y1="142" x2="144" y2="142" stroke="#4fe3d0" stroke-width="1"/>
  <text x="96" y="168" font-family="'SF Mono', ui-monospace, monospace" font-size="13" letter-spacing="4" fill="#cfd6dd" opacity="0.65">ONE SOURCE &#183; TWO DIRECTIONS</text>

