  <circle cx="380" cy="460" r="5" fill="#4fe3d0"/>

  <!-- signal one: clean, straight, home -->
  <path d="M388 456C520 430 600 330 760 330L1349 330" fill="none" stroke="#4fe3d0" stroke-width="1.5"/>

  <!-- the lamp at its end -->
  <circle cx="1356" cy="330" r="90" fill="url(#lampGlow)"/>
  <g fill="none" stroke="#e8b05c" stroke-width="1.25" stroke-linejoin="round">
