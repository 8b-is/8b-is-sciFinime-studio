    <path stroke-width="0.75" stroke-dasharray="2 6" d="M380 482V712M940 600V712M1356 352V712"/>
  </g>

  <!-- the seed -->
  <circle cx="380" cy="460" r="96" fill="url(#seedGlow)"/>
  <g fill="none" stroke="#4fe3d0" stroke-width="0.75" stroke-linecap="round" opacity="0.7">
