      <rect x="1058" y="724" width="10" height="10"/><rect x="1216" y="624" width="9" height="9"/>
      <rect x="834" y="804" width="8" height="8"/><rect x="716" y="544" width="8" height="8"/>
    </g>
  </g>
  <g fill="#b98cc0">
    <rect x="212" y="716" width="8" height="8" opacity="0.55"/>
    <rect x="436" y="794" width="7" height="7" opacity="0.5" transform="rotate(12 439.5 797.5)"/>
    <rect x="618" y="690" width="9" height="9" opacity="0.45"/>
    <rect x="866" y="780" width="8" height="8" opacity="0.5"/>
    <rect x="1090" y="700" width="10" height="10" opacity="0.45" transform="rotate(-8 1095 705)"/>
    <rect x="1336" y="820" width="7" height="7" opacity="0.5"/>
    <rect x="1470" y="660" width="8" height="8" opacity="0.4" transform="rotate(15 1474 664)"/>
    <rect x="300" y="584" width="7" height="7" opacity="0.35"/>
    <rect x="748" y="520" width="8" height="8" opacity="0.3"/>
    <rect x="1000" y="560" width="6" height="6" opacity="0.3" transform="rotate(10 1003 563)"/>
    <rect x="1248" y="600" width="9" height="9" opacity="0.35"/>
    <rect x="540" y="450" width="6" height="6" opacity="0.22"/>
    <rect x="1400" y="480" width="7" height="7" opacity="0.22"/>
    <rect x="900" y="380" width="6" height="6" opacity="0.15"/>
    <rect x="1180" y="300" width="5" height="5" opacity="0.12"/>
    <rect x="680" y="260" width="5" height="5" opacity="0.1"/>
  </g>

  <!-- amber points: the only ones with a halo -->
  <g fill="none" stroke="#e8b05c" stroke-width="0.75">
    <g transform="translate(522 742)">
      <circle r="9" opacity="0.55"/><circle r="18" opacity="0.32"/><circle r="30" opacity="0.16"/><circle r="46" opacity="0.07"/>
      <circle r="3" fill="#e8b05c" stroke="none"/>
    </g>
    <g transform="translate(1158 668)">
      <circle r="9" opacity="0.55"/><circle r="18" opacity="0.32"/><circle r="30" opacity="0.16"/><circle r="46" opacity="0.07"/>
      <circle r="3" fill="#e8b05c" stroke="none"/>
    </g>
    <g transform="translate(884 486)">
      <circle r="7" opacity="0.45"/><circle r="14" opacity="0.26"/><circle r="23" opacity="0.13"/><circle r="35" opacity="0.06"/>
      <circle r="2.5" fill="#e8b05c" stroke="none"/>
    </g>
    <g transform="translate(1388 782)">
      <circle r="8" opacity="0.5"/><circle r="16" opacity="0.3"/><circle r="27" opacity="0.15"/><circle r="40" opacity="0.07"/>
      <circle r="2.75" fill="#e8b05c" stroke="none"/>
    </g>
  </g>

  <!-- frame -->
  <rect x="28" y="28" width="1544" height="844" rx="18" fill="none" stroke="url(#frameStroke)" stroke-width="1.5"/>
</svg>
