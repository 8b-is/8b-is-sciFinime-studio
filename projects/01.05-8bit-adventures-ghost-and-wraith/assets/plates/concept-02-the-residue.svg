      <rect x="196" y="728" width="8" height="8"/><rect x="602" y="702" width="9" height="9"/>
      <rect x="1074" y="712" width="10" height="10"/><rect x="1232" y="612" width="9" height="9"/>
      <rect x="850" y="792" width="8" height="8"/><rect x="732" y="532" width="8" height="8"/>
    </g>
    <g opacity="0.1">
